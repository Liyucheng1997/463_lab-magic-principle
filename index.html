<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>魔术师背后 · 3D 魔术解密</title>
    <meta name="description" content="用 Three.js 重现经典魔术：先看表演，再切到透视模式看手里藏了什么。" />
  </head>
  <body>
    <div id="app">
      <aside class="side">
        <header class="brand">
          <h1>魔术师背后</h1>
          <p>先看一遍表演，再看一遍真相</p>
        </header>
        <nav id="tricks" class="tricks" aria-label="魔术列表"></nav>
        <footer class="side-foot">
          <button id="theme" class="btn btn-sm" type="button">深色</button>
          <span class="muted">拖动旋转 · 滚轮缩放</span>
        </footer>
      </aside>

      <main class="stage">
        <div id="view"></div>

        <div class="topbar">
          <div class="seg" role="tablist" aria-label="观看模式">
            <button id="modeShow" class="seg-item on" type="button" role="tab">表演</button>
            <button id="modeReveal" class="seg-item" type="button" role="tab">解密</button>
          </div>
          <button id="resetCam" class="btn btn-sm float" type="button">观众视角</button>
        </div>

        <section class="caption" aria-live="polite">
          <div class="cap-head">
            <span id="stepIdx" class="cap-idx tabular"></span>
            <h2 id="stepTitle"></h2>
          </div>
          <p id="see" class="see"></p>
          <div id="secretBox" class="secret" hidden>
            <span class="secret-tag"><i></i>真相</span>
            <p id="secret"></p>
            <div id="keys" class="keys"></div>
          </div>
          <p id="hint" class="hint muted">切到「解密」，碗和手会变透明，被藏起来的东西带蓝色描边。</p>

          <div class="transport">
            <button id="prev" class="icon-btn" type="button" aria-label="上一步">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z" /></svg>
            </button>
            <button id="play" class="play" type="button" aria-label="播放或暂停"></button>
            <button id="next" class="icon-btn" type="button" aria-label="下一步">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z" /></svg>
            </button>
            <div id="track" class="track"></div>
            <button id="speed" class="btn btn-sm tabular" type="button">1×</button>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
